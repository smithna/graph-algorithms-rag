# Gold set for entity resolution (talk section 4).
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE IS SHAPED THE WAY IT IS
#
# The obvious gold set is the ~40-name CORPS_MEMBERS roster from the
# corps-of-discovery-graph-rag repo's `tag_corps_members.py`. That roster is
# still here, under `roster`, and it is still useful — but on its own it is
# nearly unusable as a gold set, for a reason that is itself the point of the
# talk:
#
#     The roster uses modern canonical spellings. The graph uses the journals'
#     spellings. Ten of the 41 roster names do not exist as nodes at all.
#
# There is no PIERRE CRUZATTE node. There are eleven nodes — CRUZATTE, CRUSAT,
# PETER CRUSAT, CRUZATT, P. CRUSAT, CRUZAT, PETER CRUZAT, CRUSATT, PETE CRUSAT,
# PETER CRUSATT — none of which is spelled the way the roster spells him.
#
# So the gold set is built from `identities` instead: groups of surface forms
# that the graph actually contains and that denote one person. Every group was
# read off the live database, not invented. That makes both numbers real:
#
#   precision  a proposed pair whose endpoints belong to two DIFFERENT
#              identities is a false positive
#   recall     of all within-identity pairs that exist in the graph, how many
#              did candidate generation actually propose
#
# ─────────────────────────────────────────────────────────────────────────────
# Run
#
#     python scripts/demo_resolution.py --check-roster
#
# to see which names in this file are present in your database. Names absent
# from the graph are excluded from scoring rather than counted as misses.
# ─────────────────────────────────────────────────────────────────────────────


# ── The reference roster ──────────────────────────────────────────────────────
# Modern canonical spellings, from tag_corps_members.py. Used to report coverage
# and to name each identity below. Not used directly for scoring.
