  - CHARLES FLOYD            # died August 1804
  - JOSEPH FIELD
  - REUBIN FIELD
  - GEORGE SHANNON
  - JOHN COLTER
  - WILLIAM BRATTON
  - JOHN COLLINS
  - PIERRE CRUZATTE
  - ROBERT FRAZER
  - SILAS GOODRICH
  - HUGH HALL
  - THOMAS HOWARD
  - FRANCOIS LABICHE
  - JEAN BAPTISTE LEPAGE     # joined at Fort Mandan
  - HUGH MCNEAL
  - JOHN POTTS
  - GEORGE GIBSON
  - JOHN SHIELDS
  - JOHN B. THOMPSON
  - PETER WEISER
  - JOSEPH WHITEHOUSE
  - ALEXANDER WILLARD
  - RICHARD WINDSOR
  - WERNER                   # William Werner
  - HOWARD                   # Thomas P. Howard
  - GEORGE DROUILLARD
  - YORK
  - TOUSSAINT CHARBONNEAU
  - SACAGAWEA
  - JEAN BAPTISTE CHARBONNEAU  # "Pomp", born during the expedition
  - JOHN NEWMAN              # discharged for mutinous expression
  - MOSES REED               # deserted, returned
  - JOHN DAME
  - EBENEZER TUTTLE
  - ISAAC WHITE
  - RICHARD WARFINGTON       # led the return keelboat party


# ── Identities ────────────────────────────────────────────────────────────────
# Each group is one person, listed under every surface form that exists in the
# graph as its own node. Read off the live database — every name here was
# observed, none inferred.
#
# Groups with more than one member are unresolved duplicates: the entity
# resolution pipeline ran twice and left these behind. They are the true
# positives the demo should re-find.
identities:
  - person: GEORGE DROUILLARD
    names: [DREWYER, GEORGE DROUILLARD, GEORGE DREWYER, DREWYERS]
    why: >
      The expedition's chief hunter and sign-language interpreter. DREWYER is
      Clark's phonetic spelling and carries 265 mentions; GEORGE DROUILLARD
      carries 63. One man, 328 mentions, split across two nodes that no string
      signal will ever join — Jaro-Winkler on "DREWYER" vs "DROUILLARD" is far
      below threshold and the metaphone codes differ. This is the headline pair
      for the section: only co-occurrence finds it.

  - person: PIERRE CRUZATTE
    names:
      [CRUZATTE, CRUSAT, PETER CRUSAT, CRUZATT, P. CRUSAT, CRUZAT,
       PETER CRUZAT, CRUSATT, PETE CRUSAT, PETER CRUSATT]
    why: >
      Boatman and fiddler; the man who shot Lewis by accident. Eleven nodes.
      "Peter" is the journals' anglicisation of Pierre.

  - person: FRANCOIS LABICHE
    names:
      [LABIECH, LABEECH, LABIESH, LABIECHE, LABICH, LABEACH, LABEASH,
       LABIACH, LABICHE, FRANCIS LABICHE, FRANCIS LABIECH]
    why: Interpreter. Eleven spellings, no two journal entries agreeing.

  - person: WILLIAM BRATTON
    names:
      [BRATTEN, BRATTON, WILLIAM BRATTON, WILLIAM BRATTEN, W. BRATTIN,
       W BRATTEN, WILL BRATTIN, WILLIAM BRATTIN, WM BRATTEN]
    why: >
      Blacksmith. BRATTEN (24 mentions) and BRATTON (23) are near-equal halves
      of one man — a case where the split is almost perfectly even, so neither
      node looks obviously wrong on its own.

  - person: JOHN SHIELDS
    names: [SHIELDS, JOHN SHIELDS, SHEILDS, J. SHIELDS, JOHN SHEILDS, J SHIELDS, SHEILDES]
    why: Gunsmith. The "ie"/"ei" transposition recurs throughout.

  - person: JOHN COLTER
    names: [COLTER, JOHN COLTER, COALTER]
    why: >
      Later famous for Colter's Run. COLUMBUS COLTER and JOSEPH COLTER also
      exist in the graph but are listed under `uncertain` — the given names are
      wrong for this man and it is not clear whether they are misreadings of
      John or a different person entirely.

  - person: PETER WEISER
    names: [WISER, PETER WISER, P. WISER]
    why: Cook. The roster's "WEISER" spelling appears nowhere in the graph.

  - person: ROBERT FRAZER
    names: [FRAZIER, FRAZER, FRAZIERS, FRAZUR, ROBERT FRAZIER, ROBERT FRAZURE]
    why: Kept his own journal, later published.

  - person: THOMAS HOWARD
    names: [HOWARD, THOMAS P. HOWARD, T. P. HOWARD]
    why: >
      The roster lists both HOWARD and THOMAS HOWARD as separate entries, which
      is the roster itself recording a duplicate it could not merge. The graph
      has a third form, T. P. HOWARD.

  - person: WILLIAM WERNER
    names: [WERNER, WILLIAM WERNER, WARNER, WILLIAM WARNER]
    why: Werner/Warner alternate freely; both spellings carry mentions.

  - person: JEAN BAPTISTE LEPAGE
    names: [LAPAGE, LA PAGE, LEPAGE, BAPTIEST LA PAGE, BAPTIEST LAPAGE, BAPTEIST LAPAGE]
    why: >
      Joined at Fort Mandan. The space in "LA PAGE" defeats token containment,
      which compares token sets — one name has two tokens where the other has one.

  - person: MOSES REED
    names: [M B REED, MOSES B. REED, REED, MR. REED]
    why: Deserted in August 1804, court-martialled, returned with the keelboat.

  - person: JOSEPH WHITEHOUSE
    names: [WHITEHOUSE, JOSEPH WHITEHOUSE, JO WHITEHOUSE]
    why: Also kept a journal.

  - person: SILAS GOODRICH
    names: [GOODRICH, GUTRICH, SILAS GOODRICH, SILAS GUTRICH]
    why: >
      The expedition's best angler. GOODRICH vs GUTRICH is the double-metaphone
      case in miniature — the strings diverge, the phonetic codes do not.

  - person: HUGH MCNEAL
    names: [MCNEAL, H. MCNEAL, HUE MCNEAL, HUGH MCNEAL]
    why: >
      HUE for HUGH is a phonetic spelling, not a different man.

  - person: JOHN B. THOMPSON
    names: [JOHN B. THOMPSON, THOMPSON]
    why: Surveyor.

  - person: ALEXANDER WILLARD
    names: [WILLARD, ALEXANDER WILLARD]
    why: Blacksmith. WILLARD alone carries 52 mentions.

  - person: RICHARD WINDSOR
    names: [WINDSOR, RICHARD WINDSOR]
    why: Hunter.

  - person: GEORGE GIBSON
    names: [GIBSON, GEORGE GIBSON]
    why: Hunter and fiddler.

  - person: JOHN POTTS
    names: [POTTS, JOHN POTTS]
    why: >
      JOSEPH POTTS also exists and is listed under `uncertain` — John Potts is
      the corps member, and whether "Joseph Potts" is a misreading is not
      something this gold set should assert.

  - person: SACAGAWEA
    names:
      [SACAGAWEA, INDIAN WOMAN, THE INDIAN WOMAN, OUR INDIAN WOMAN,
       THE INDIAN WOMAN WITH US, SQUAR, THE SQUAR, THE SQUAW, HIS SQUAR,
       SQUARWIFE, SQUAR INTERPRETRESS, SQUAR WIFE TO SHABONO,
       THE WIFE OF SHABONO, WIFE OF SHABONO, SHABONOS WIFE,
       SNAKE INDIAN WIFE, OUR INTERPRETER THE SNAKE WOMAN, JANEY,
       INTERPRETERS WIFE]
    why: >
      The single most fragmented identity in the corpus: nineteen surface forms,
      almost none of which share a token with "SACAGAWEA". She is named directly
      only 8 times and referred to indirectly far more often.

      This list is the reason the identity matters for the talk. The
      corps-of-discovery pipeline resolves her with `enrich_sacagawea.py`, a
      hand-written script that scrapes a curated list of 13 surface forms from
      lewis-clark.org — an **external, third-party dependency** that someone had
      to find, maintain, and trust. If co-occurrence recovers the same cluster
      from evidence inside the corpus, the external list is replaceable, and the
      forms below were read off the graph rather than off that website.

      Deliberately excluded as genuinely ambiguous, not merely hard:
      INTERPRETER / OUR INTERPRETER / THE INTERPRETER (Charbonneau was the
      interpreter; Sacagawea was the *interpretress*), HIS WIFE (context-
      dependent — it is her in the passages near Charbonneau, but the string
      alone does not say so), and JUSSOMS SQUAR (Jessaume's wife, a different
      woman). These are in `uncertain` below so they score neither way.

  - person: MERIWETHER LEWIS
    names: [MERIWETHER LEWIS]
  - person: WILLIAM CLARK
    names: [WILLIAM CLARK]
  - person: JOHN ORDWAY
    names: [JOHN ORDWAY]
  - person: PATRICK GASS
    names: [PATRICK GASS]
  - person: NATHANIEL PRYOR
    names: [NATHANIEL PRYOR]
  - person: CHARLES FLOYD
    names: [CHARLES FLOYD]
  - person: JOSEPH FIELD
    names: [JOSEPH FIELD]
  - person: REUBIN FIELD
    names: [REUBIN FIELD, REUBIN FIELDS, REUBIN FEILDS, RUBEN FIELDS, RUBIN FIELDS]
    why: Five spellings of the younger Field brother.
  - person: GEORGE SHANNON
    names: [GEORGE SHANNON, G. SHANNON]
  - person: JOHN COLLINS
    names: [JOHN COLLINS]
  - person: HUGH HALL
    names: [HUGH HALL]
  - person: YORK
    names: [YORK]
  - person: TOUSSAINT CHARBONNEAU
    names: [TOUSSAINT CHARBONNEAU, SHARBONO, SHABONO]
    why: >
      The journals write Charbonneau as Chabonah, Shabono, Sharbono. This is the
      pair the outline calls out: raw Jaro-Winkler scores it below threshold,
      but double-metaphone on the surname (XPN vs XRPN) sits at about 0.925.
  - person: JOHN NEWMAN
    names: [JOHN NEWMAN]


# ── Malformed nodes ───────────────────────────────────────────────────────────
