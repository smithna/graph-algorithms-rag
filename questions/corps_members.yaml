# ── Uncertain ─────────────────────────────────────────────────────────────────
# Nodes that are probably misreadings of a listed identity, but where asserting
# it would be guessing. Excluded from scoring. Listed so the demo can say why a
# plausible-looking pair is not counted either way.
uncertain:
  - name: COLUMBUS COLTER
    probably: JOHN COLTER
  - name: JOSEPH COLTER
    probably: JOHN COLTER
  - name: JOSEPH POTTS
    probably: JOHN POTTS
  - name: JOHN PRYOR
    probably: NATHANIEL PRYOR
  - name: HIS WIFE
    probably: SACAGAWEA
  - name: INTERPRETER
    probably: TOUSSAINT CHARBONNEAU
  - name: OUR INTERPRETER
    probably: TOUSSAINT CHARBONNEAU
  - name: THE INTERPRETER
    probably: TOUSSAINT CHARBONNEAU


# ── Hard negatives ────────────────────────────────────────────────────────────
# Genuinely different people that a naive signal fuses. Each names the signal it
# defeats — these are the slides.
never_merge:
  - names: [JOSEPH FIELD, REUBIN FIELD]
    defeats: string
    why: >
      Brothers. Jaro-Winkler on the full names is very high, and they appear
      together in nearly every hunting party, so co-occurrence agrees with the
      string signal. Both are wrong. This is the pair that shows why an
      adjudication step exists at all.

  - names: [TOUSSAINT CHARBONNEAU, JEAN BAPTISTE CHARBONNEAU]
    defeats: string
    why: >
      Father and son. Identical surname, and the son is an infant carried by his
      mother, so the two co-occur constantly.

  - names: [MERIWETHER LEWIS, WILLIAM CLARK]
    defeats: cooccurrence
    why: >
      The worst case for the graph signal in this corpus. The captains are
      mentioned together across a large fraction of all chunks, so their
      co-occurrence vectors are nearly parallel. Strings disagree completely,
      which is the only thing saving them. Proof that co-occurrence must be
      corroborated, never trusted alone.

  - names: [PATRICK GASS, NATHANIEL PRYOR]
    defeats: string
    why: >
      Both sergeants. In raw journal text they appear as "Sergt. Gass" and
      "Sergt. Pryor", sharing a high-weight leading token — and Jaro-Winkler
      weights shared prefixes especially heavily. This pair is why the string
      ladder strips TITLE_TOKENS before comparing.

  - names: [JOHN SHIELDS, JOHN COLLINS]
    defeats: string
    why: Shared given name, different men. Prefix-weighted similarity over-scores it.

  - names: [JOHN NEWMAN, JOHN POTTS]
    defeats: string
    why: Shared given name. Same failure mode as Shields/Collins.

  - names: [JOSEPH WHITEHOUSE, JOSEPH FIELD]
    defeats: string
    why: Shared given name, both privates in the permanent party.

  - names: [GEORGE SHANNON, GEORGE GIBSON]
    defeats: string
    why: Shared given name; both hunters who co-occur constantly.

  - names: [GEORGE DROUILLARD, GEORGE SHANNON]
    defeats: string
    why: >
      Observed live: the string ladder proposes this pair on the shared given
      name, and WCC then welds Shannon into the Drouillard identity. A single
      wrong edge is all transitive closure needs.
