# Benchmark question bank.
#
# `gold` is the set of entities a correct answer must be grounded in. Recall is
# measured by checking whether each gold entity is present in the context a
# strategy assembled — by mention edge or by any surface form the graph knows.
#
# ─────────────────────────────────────────────────────────────────────────────
# GOLD FORMAT (Step 5, 2026-09-07)
#
# Each entry in `gold` is a display name. Each question's `targets` map pins
# that name to the ONE node that carries it in the graph, as a
# [canonicalName, label] pair. The pair is what gets scored; the display name
# is what reports and slides show.
#
# Why pairs: several display names used to resolve to near-empty decoy nodes
# ("a node named ELK exists" ≠ "the elk"), and a bare name cannot distinguish
# the NativeNation SHOSHONE from a stray Person of the same name. The pin is
# chosen by the mention-count prominence prior — the same tie-breaker
# `resolve.py` uses — and every pair below was re-verified against `lewisclark`
# on 2026-09-07. `scripts/verify_questions.py` enforces all of it: the pinned
# node must exist, be unique under (name, label), and be the most-mentioned
# node bearing that name.
#
# Why `gold` stays a list of plain strings: section 5's frozen scripts
# (demo_pagerank.py, sweep_pagerank.py, measure_seeds.py) read `gold` as
# strings and map them through questions/gold_overrides.yaml. This file is the
# source of truth for section 8; the overrides file survives only as their
# compatibility shim — see its header.
#
# Mapping changes made when re-verifying on `lewisclark` (the pre-migration
# decoy table did NOT carry over unchanged):
#   GREAT FALLS   the plain name is now the real falls node (WaterBody, 32
#                 mentions); GREAT FALLS OF THE MISSOURI shrank to 2. The old
#                 override has this backwards on this database.
#   FORT CLATSOP  now a real Place (36); the old CLATSOP VILLAGE pin has 3.
#   SALMON        ONCORHYNCHUS CLARKII is aliased "TROUT" on lewisclark
#                 (cutthroat trout) — counting it would score trout passages
#                 as salmon. Pinned to ONCORHYNCHUS TSHAWYTSCHA (121) alone.
#   NEZ PERCE     no longer thin: 110 mentions, every Chopunnish spelling
#                 merged in as an alias. The pre-migration extraction gap
#                 (2 mentions) was repaired by the luna re-extraction.
# ─────────────────────────────────────────────────────────────────────────────
#
# Fields:
#   id        stable key, used by `--only`
#   question  the query as a user would ask it
#   gold      display names of the entities a correct answer requires
#   targets   display name -> [canonicalName, label], the node that is scored
#   anchors   optional pair for the `paths` strategy; inferred if omitted
#   kind      which retrieval property the question is designed to stress
#   notes     why this question is in the bank

# ── Connection questions: the answer is a relationship, not a passage ─────────

- id: shoshone-horses
  question: How did the Corps of Discovery obtain horses from the Shoshone?
  kind: connection
  anchors: [Sacagawea, Shoshone]
  gold:
    - SACAGAWEA
    - SHOSHONE
    - MERIWETHER LEWIS
    - WILLIAM CLARK
  targets:
    SACAGAWEA: [SACAGAWEA, Person]
    SHOSHONE: [SHOSHONE, NativeNation]
    MERIWETHER LEWIS: [MERIWETHER LEWIS, Person]
    WILLIAM CLARK: [WILLIAM CLARK, Person]
  notes: >
    The mechanism spans several entries and hinges on Sacagawea's kinship tie.
    Vector search finds passages about horses; it does not assemble the chain.

- id: sacagawea-interpreting
  question: Which Native nations did Sacagawea interpret for, and how did that work?
  kind: connection
  anchors: [Sacagawea, Shoshone]
  gold:
    - SACAGAWEA
    - SHOSHONE
    - TOUSSAINT CHARBONNEAU
  targets:
    SACAGAWEA: [SACAGAWEA, Person]
    SHOSHONE: [SHOSHONE, NativeNation]
    TOUSSAINT CHARBONNEAU: [TOUSSAINT CHARBONNEAU, Person]
  notes: >
    Sacagawea is rarely named directly. Alias-aware recall is the point here —
    canonical-name-only matching badly understates every strategy. Known bound:
    SHABONO (31 chunks) is still a separate node from TOUSSAINT CHARBONNEAU
    (69) on lewisclark, so passages that name him only as Shabono earn no
    credit — section 4's residue, deliberately not patched around here.

- id: charbonneau-role
  question: What was Toussaint Charbonneau's role on the expedition?
  kind: connection
  anchors: [Toussaint Charbonneau, Hidatsa]
  gold:
    - TOUSSAINT CHARBONNEAU
    - SACAGAWEA
    - HIDATSA
  targets:
    TOUSSAINT CHARBONNEAU: [TOUSSAINT CHARBONNEAU, Person]
    SACAGAWEA: [SACAGAWEA, Person]
    HIDATSA: [HIDATSA, NativeNation]
  notes: Tests whether a path through a spouse relationship surfaces context.

- id: ordway-responsibilities
  question: What responsibilities did Sergeant Ordway carry on the expedition?
  kind: connection
  gold:
    - JOHN ORDWAY
  targets:
    JOHN ORDWAY: [JOHN ORDWAY, Person]
  notes: >
    Designed as a PPR case (2026-09-07) and verified by reading both windows.
    Co-typed substitution at the Sergeant rank: 74 passages mention Ordway at
    median cosine rank 95, and the vector top-8 holds him in 5 slots — the rest
    go to no-name sergeant duty orders and a Cameahwait scene. Entity-seeded
    PPR fills 8/8, and two promotions cleared the finding-5d hand-read bar
    with content no cosine passage had: his 1804-05-17 order convening a court
    martial in the captains' behalf, and the 1804-05-26 detachment order
    putting his squad in command of the batteaux crew. Cypher has no counter:
    his 102 extracted edges are travel-diary noise (CAMPED_AT/VISITED/...)
    and a 74-passage entity filter has nothing to ORDER BY. A companion case,
    cameahwait-horses, FAILED the same hand read (PPR drops the best passage
    and imports the rival Nez Perce horse-trading cluster via the passage
    seeds) and was deliberately not added — see outline finding 5f.

# ── Authority questions: many passages match, few are load-bearing ────────────

- id: grizzly-encounters
  question: What happened when the expedition encountered grizzly bears?
  kind: authority
  gold:
    - GRIZZLY BEAR
    - MERIWETHER LEWIS
  targets:
    GRIZZLY BEAR: [URSUS ARCTOS HORRIBILIS, AnimalSpecies]
    MERIWETHER LEWIS: [MERIWETHER LEWIS, Person]
  notes: >
    Dozens of passages mention bears. Personalized PageRank should favour the
    entries that are structurally central to the bear-encounter cluster.

- id: great-falls-portage
  question: What made the portage around the Great Falls so difficult?
  kind: authority
  gold:
    - GREAT FALLS
    - MISSOURI RIVER
    - MERIWETHER LEWIS
  targets:
    GREAT FALLS: [GREAT FALLS, WaterBody]
    MISSOURI RIVER: [MISSOURI RIVER, WaterBody]
    MERIWETHER LEWIS: [MERIWETHER LEWIS, Person]
  notes: Long multi-week episode; vector top-k tends to land on one day of it.

- id: fort-clatsop-winter
  question: What were conditions like during the winter at Fort Clatsop?
  kind: authority
  gold:
    - FORT CLATSOP
    - WILLIAM CLARK
    - CLATSOP
  targets:
    FORT CLATSOP: [FORT CLATSOP, Place]
    WILLIAM CLARK: [WILLIAM CLARK, Person]
    CLATSOP: [CLATSOP, NativeNation]
  notes: Tests whether reranking pulls the whole winter rather than one entry.

# ── Thematic questions: the answer needs breadth, not depth ───────────────────

- id: trade-goods
  question: What goods did the expedition trade with Native nations along the route?
  kind: thematic
  gold:
    - MANDAN
    - SHOSHONE
    - NEZ PERCE
    - CLATSOP
  targets:
    MANDAN: [MANDAN, NativeNation]
    SHOSHONE: [SHOSHONE, NativeNation]
    NEZ PERCE: [NEZ PERCE, NativeNation]
    CLATSOP: [CLATSOP, NativeNation]
  notes: >
    A correct answer spans nations and geography. Vector top-k typically
    returns eight near-duplicate passages about one trading session.

- id: food-sources
  question: How did the expedition feed itself across different stretches of the journey?
  kind: thematic
  gold:
    - BISON
    - SALMON
    - ELK
    - CAMAS
  targets:
    BISON: [BISON BISON, AnimalSpecies]
    SALMON: [ONCORHYNCHUS TSHAWYTSCHA, AnimalSpecies]
    ELK: [CERVUS CANADENSIS, AnimalSpecies]
    CAMAS: [CAMASSIA QUAMASH, PlantSpecies]
  notes: Community diversification should beat plain similarity clearly here.

- id: illness-and-injury
  question: What illnesses and injuries did the corps deal with?
  kind: thematic
  gold:
    - CHARLES FLOYD
    - WILLIAM CLARK
    - MERIWETHER LEWIS
  targets:
    CHARLES FLOYD: [CHARLES FLOYD, Person]
    WILLIAM CLARK: [WILLIAM CLARK, Person]
    MERIWETHER LEWIS: [MERIWETHER LEWIS, Person]
  notes: Spread thinly across the whole corpus rather than clustered.

# ── Sequence questions: order matters ─────────────────────────────────────────

- id: before-floyd-death
  question: What was happening in the days before Sergeant Floyd died?
  kind: sequence
  gold:
    - CHARLES FLOYD
    - MISSOURI RIVER
  targets:
    CHARLES FLOYD: [CHARLES FLOYD, Person]
    MISSOURI RIVER: [MISSOURI RIVER, WaterBody]
  notes: >
    ⚠️ MEASURED FALSE (2026-09-07). This note used to claim NEXT_CHUNK edges let
    PageRank flow along the journal's reading order. They do not help here.
    Floyd died 1804-08-20; 18 passages exist for 08-13..08-20. Cosine's top-8
    contains 3 of them. So does every graph variant tried, including
    lc-retrieval with NEXT_CHUNK at damping 0.85 — 3/18 in the top-8 and 3/18
    in the top-20. Fifteen of the eighteen are ordinary daily entries whose
    vocabulary and entity structure say nothing about Floyd; only the DATE does.
    A date-filtered Cypher query returns all 18 in one hop.
    This is a text2cypher question, not a graph-algorithm question. Do not use
    it to evaluate PageRank.

- id: pacific-arrival
  question: What did the party record when they first reached the Pacific?
  kind: sequence
  gold:
    - PACIFIC OCEAN
    - WILLIAM CLARK
    - COLUMBIA RIVER
  targets:
    PACIFIC OCEAN: [PACIFIC OCEAN, WaterBody]
    WILLIAM CLARK: [WILLIAM CLARK, Person]
    COLUMBIA RIVER: [COLUMBIA RIVER, WaterBody]
  notes: >
    A well-known moment — a fair test of whether graph methods hurt easy cases.
    Known bound: PACIFIC OCEAN has 19 mentions on lewisclark and an unmerged
    twin, PACIFIC OCIAN (5) — a real section-4 residual that bounds every
    strategy here, reported rather than patched around.

# ── Control questions: plain vector search should already win ────────────────

- id: keelboat-return
  question: When was the keelboat sent back down the Missouri?
  kind: control
  gold:
    - MISSOURI RIVER
    - FORT MANDAN
  targets:
    MISSOURI RIVER: [MISSOURI RIVER, WaterBody]
    FORT MANDAN: [FORT MANDAN, Place]
  notes: >
    Narrow factual lookup. If a graph strategy loses badly here, the ranking
    blend is over-weighted toward structure. Control questions keep the
    benchmark honest.

- id: prairie-dog
  question: How did the expedition describe the prairie dog?
  kind: control
  gold:
    - PRAIRIE DOG
  targets:
    PRAIRIE DOG: [CYNOMYS LUDOVICIANUS, AnimalSpecies]
  notes: >
    Single distinctive entity, single cluster of passages. Vector is enough.
    The journals never say "prairie dog" — they say barking/burrowing squirrel
    — so scoring this question at all depends on mention edges, not text match.
